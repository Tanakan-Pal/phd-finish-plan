  out+=E('header.title',h.title,'h1')+E('header.intro',h.intro,'p','muted');
  out+='<div class="facts">'+h.facts.map(function(f,i){var p='header.facts.'+i;return '<div class="fact">'+E(p+'.label',f.label)+E(p+'.value',f.value,'b')+E(p+'.sub',f.sub)+del(p)+'</div>';}).join('')+'</div>'+add('header.facts','Add fact')+'</header>';

  out+='<section><span class="eyebrow">Progress</span><div class="prog"><svg viewBox="0 0 240 210" role="img" aria-label="Vesicle fusion progress: '+pr.p+' percent, '+sc.n+' calcium stars">'+sc.svg+'</svg><div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div class="big">'+pr.p+'%</div><div class="bar"><i style="width:'+pr.p+'%"></i></div><p class="muted">'+pr.done+' of '+pr.total+' tasks done · Ca²⁺ '+sc.n+'/5'+(pr.p>=100?' · Fused':'')+'</p><div class="stages">'+STG.map(function(m){return '<span class="'+(pr.p>=m[0]?'on':'')+'">'+m[1]+' · '+m[0]+'%</span>';}).join('')+'</div><p class="note">Each Ca²⁺ star marks a stage reached. When every task is ticked, the vesicle fuses and releases its flowers.</p></div></div></section>';

  out+='<section><span class="eyebrow">The claim</span>'+E('claim.text',S.claim.text,'p','claim')+'<p class="muted">Working title: '+E('claim.title',S.claim.title,'i')+'</p></section>';


  out+='<section><span class="eyebrow">Results and figures</span>'+E('sec.results',S.sec.results,'h2')+E('sec.resultsNote',S.sec.resultsNote,'p','note')+'<div class="tbl"><table><thead><tr><th>Thesis</th><th>Finding</th><th>Data</th><th>Paper</th><th>Status</th>'+(editing?'<th></th>':'')+'</tr></thead><tbody>'+S.results.map(function(r,i){var p='results.'+i;return '<tr><td class="fig">'+E(p+'.thesis',r.thesis)+'</td><td>'+E(p+'.finding',r.finding)+'</td><td>'+E(p+'.data',r.data)+'</td><td class="fig">'+E(p+'.paper',r.paper)+'</td><td><span class="pill '+r.kind+'">'+E(p+'.status',r.status)+'</span> '+kindSel(p+'.kind',r.kind,KINDS)+'</td>'+(editing?'<td>'+mv('results',i)+del(p)+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>'+add('results','Add row')+'</section>';

  out+='<section><span class="eyebrow">Thesis chapters</span>'+E('sec.chapters',S.sec.chapters,'h2')+'<div class="tbl"><table><thead><tr><th>Part</th><th>Contents</th><th>Write</th><th>Paper gets</th>'+(editing?'<th></th>':'')+'</tr></thead><tbody>'+S.chapters.map(function(r,i){var p='chapters.'+i;return '<tr><td class="fig">'+E(p+'.part',r.part)+'</td><td>'+E(p+'.contents',r.contents)+'</td><td>'+E(p+'.write',r.write)+'</td><td>'+E(p+'.paper',r.paper)+'</td>'+(editing?'<td>'+mv('chapters',i)+del(p)+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>'+add('chapters','Add row')+E('sec.files',S.sec.files,'p','note')+'</section>';

  out+='<section><span class="eyebrow">Remaining work</span>'+E('sec.tasks',S.sec.tasks,'h2')+'<p class="note">'+(mode==='claude'?'Ticks save to the page, so progress is the same on every device.':'Ticks and edits save in this browser. Use Download page to keep them in your repository.')+'</p><div class="cols">'+S.tasks.map(function(g,gi){var p='tasks.'+gi;return '<div class="list"><h3><span class="pill '+g.kind+'">'+E(p+'.tag',g.tag)+'</span>'+E(p+'.title',g.title)+kindSel(p+'.kind',g.kind,KINDS)+del(p)+'</h3>'+g.items.map(function(it,ii){return itemHTML(it,p+'.items.'+ii);}).join('')+(editing?'<button class="btn small add" type="button" data-additem="'+p+'.items">+ Add task</button>':'')+'</div>';}).join('')+'</div>'+add('tasks','Add group')+E('sec.out',S.sec.out,'p','note')+'</section>';

  out+='<section><span class="eyebrow">Timeline</span>'+E('sec.timeline',S.sec.timeline,'h2')+'<div class="timeline">'+S.timeline.map(function(r,i){var p='timeline.'+i;return '<div class="tl k-'+r.kind+'">'+E(p+'.when',r.when,'time')+E(p+'.text',r.text,'div','tx')+'<div style="display:flex;gap:6px;align-items:start">'+kindSel(p+'.kind',r.kind,{normal:'normal',key:'milestone',gate:'decision'})+mv('timeline',i)+del(p)+'</div></div>';}).join('')+'</div>'+add('timeline','Add entry')+'</section>';

  out+='<section><span class="eyebrow">Journal ladder</span>'+E('sec.journals',S.sec.journals,'h2')+'<div class="ladder">'+S.journals.map(function(j,i){var p='journals.'+i;return '<div class="rung"><span class="n">'+(i+1)+'</span><div>'+E(p+'.name',j.name)+'<small>'+E(p+'.note',j.note)+'</small></div>'+E(p+'.metric',j.metric,'span','if')+'<span style="display:flex;gap:6px">'+mv('journals',i)+del(p)+'</span></div>';}).join('')+'</div>'+add('journals','Add journal')+E('sec.journalNote',S.sec.journalNote,'p','note')+'</section>';

  out+='<section><span class="eyebrow">Submission package</span>'+E('condense.title',S.condense.title,'h2')+'<div class="list">'+S.condense.items.map(function(it,i){return itemHTML(it,'condense.items.'+i);}).join('')+(editing?'<button class="btn small add" type="button" data-additem="condense.items">+ Add item</button>':'')+'</div></section>';

  out+='<section><span class="eyebrow">Risks</span><div class="cols">'+S.risks.map(function(r,i){var p='risks.'+i;return '<div class="list"><h3>'+E(p+'.title',r.title)+del(p)+'</h3>'+E(p+'.text',r.text,'p','muted')+'</div>';}).join('')+'</div>'+add('risks','Add risk')+'</section>';

  out+='<footer>'+E('footer',S.footer,'span')+(S.saved?' · Last saved '+esc(S.saved):'')+'</footer>';
  if(editing)out+='<div class="savebar"><span id="saveMsg">Editing. Click any text to change it.</span><button class="btn" type="button" id="cancelBtn">Cancel</button><button class="btn primary" type="button" id="saveBtn">Save changes</button></div>';
  else out+='<div id="saveMsg" aria-live="polite"></div>';
  document.getElementById('root').innerHTML=out;
}

function collect(){document.querySelectorAll('[data-p]').forEach(function(el){setP(el.getAttribute('data-p'),el.innerText.replace(/\n+$/,'').trim());});document.querySelectorAll('[data-k]').forEach(function(el){setP(el.getAttribute('data-k'),el.value);});}
function msg(t){var m=document.getElementById('saveMsg');if(m)m.textContent=t;}

function buildDoc(){
  var reset=(document.head.querySelector('style')||{}).textContent||'';
  var st=JSON.stringify(S).replace(/</g,'\\u003c');
  var parts=document.getElementById('pagecss').outerHTML;
  var app=document.getElementById('app').outerHTML;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>PhD Finish Plan</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">\n'+
    parts+'\n<div class="wrap" id="root"></div>\n<script id="state" type="application/json">'+st+'<\/script>\n'+app+'</body></html>';
}
function publish(){
  if(mode==='local'){var d0=new Date();S.saved=d0.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});try{localStorage.setItem(LKEY,JSON.stringify(S));localEdits=true;BASE=JSON.stringify(S);render();msg('Saved in this browser. Download page to keep it in your repository.');}catch(e){msg('This browser blocked saving. Download page to keep your edits.');}return;}
  if(!art){msg('Saving isn’t available in this view.');return;}
  var d=new Date();S.saved=d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  msg('Saving…');
  art.publish(buildDoc()).then(function(){msg('Saved');},function(e){
    var c=e&&e.code;
    if(c==='conflict')msg('A newer version was saved elsewhere; loading it.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){readOnly=true;editing=false;render();msg('This view is read-only.');}
    else if(c==='rate_limited')msg('Saving too often. Wait a moment, then save again.');
    else msg('Couldn’t save. Try again in a moment.');
  });
}

document.getElementById('root').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='editBtn'){editing=true;render();return;}
  if(t.id==='cancelBtn'){S=JSON.parse(BASE);editing=false;render();return;}
  if(t.id==='dlBtn'&&dl){dl.save({filename:'index.html',data:buildDoc()}).then(function(r){msg(r&&r.status==='saved'?'Downloaded index.html.':'');},function(e){if(e&&e.code==='unavailable'){dl=null;render();}else msg('The download didn’t go through.');});return;}
  if(t.id==='dlBtn'){var blob=new Blob([buildDoc()],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);msg('Downloaded index.html. Replace the file in your repository with it.');return;}
  if(t.id==='resetBtn'){try{localStorage.removeItem(LKEY);}catch(e){}S=JSON.parse(EMBED);BASE=EMBED;localEdits=false;render();msg('Showing the version stored in the file.');return;}
  if(t.id==='saveBtn'){collect();editing=false;render();publish();return;}
  collect();
  if(t.dataset.add){var arr=getP(t.dataset.add);var tp=JSON.parse(JSON.stringify(TEMPL[t.dataset.add]));arr.push(tp);}
  else if(t.dataset.additem){getP(t.dataset.additem).push(itemT());}
  else if(t.dataset.del){var ks=t.dataset.del.split('.'),idx=+ks.pop();getP(ks.join('.')).splice(idx,1);}
  else if(t.dataset.up){var u=t.dataset.up.split('.'),i=+u.pop(),a=getP(u.join('.'));if(i>0){var x=a[i];a[i]=a[i-1];a[i-1]=x;}}
  render();
});
document.getElementById('root').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.tick){if(editing)collect();setP(t.dataset.tick+'.done',t.checked);render();
    if(!editing&&!readOnly){msg('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(publish,1500);}}
  else if(t.dataset.k&&editing){collect();render();}
});

render();
if(mode==='claude'){window.claude.use('downloads').then(function(d){if(d){dl=d;render();}},function(){});window.claude.use('artifact').then(function(a){art=a;if(!a){readOnly=true;render();}},function(){readOnly=true;render();});}
})();
</script>
</body></html>
